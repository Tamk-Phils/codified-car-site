[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"

# All HTML routes go through the SSR edge function
[[edge_functions]]
  path = "/*"
  function = "server"

# Bypass edge function for static assets
[headers]
  [[headers.values]]
    for = "/assets/*"
    [headers.values.headers]
      Cache-Control = "public, max-age=31536000, immutable"
